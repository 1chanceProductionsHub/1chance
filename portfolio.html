<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Creative Works</title>

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- WOW.js for Scroll Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="path/to/your/styles.css">
    
    <!-- Optional: jQuery (for WOW.js) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- WOW.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
</head>
<body>

    <!-- Portfolio Section -->
    <section id="portfolios" class="section-padding">
        <!-- Container Starts -->
        <div class="container">
            <h2 class="section-title wow flipInX" data-wow-delay="0.4s">Our Creative Stories</h2>
            <div class="row">
                <!-- Portfolio items here -->
                <div class="col-sm-6 col-md-4 col-lg-4 col-xl-4 mix unity wow fadeInUp" data-wow-delay="0.2s">
                    <div class="portfolio-item">
                        <div class="shot-item">
                            <img src="assets/Memo.JPG" alt="" height="250" width="500"/>  
                            <div class="overlay">
                                <p class="overlay-text">
                                    A Memo web application to write, edit, save, and delete information.
                                </p>
                                <div class="icons">
                                    <a class="lightbox preview" href="assets/videos/memo.mp4">
                                        <i class="icon-eye"></i>
                                    </a>
                                </div>
                            </div>
                        </div>               
                    </div>
                </div>

                <div class="col-sm-6 col-md-4 col-lg-4 col-xl-4 mix unreal wow fadeInUp" data-wow-delay="0.4s">
                    <div class="portfolio-item">
                        <div class="shot-item">
                            <img src="assets/Temperature.JPG" alt="" height="250" width="500"/>  
                            <div class="overlay">
                                <p class="overlay-text">
                                    Simple Temperature conversion website that converts Celcius to Fahrenheit and Fahrenheit to Celcius.
                                </p>
                                <div class="icons">
                                    <a class="lightbox preview" href="assets/videos/temperature.mp4">
                                        <i class="icon-eye"></i>
                                    </a>
                                </div>
                            </div>
                        </div>               
                    </div>
                </div>

                <div class="col-sm-6 col-md-4 col-lg-4 col-xl-4 mix python wow fadeInUp" data-wow-delay="0.6s">
                    <div class="portfolio-item">
                        <div class="shot-item">
                            <img src="assets/COVID.JPG" alt="" height="250" width="500"/>  
                            <div class="overlay">
                                <p class="overlay-text">
                                    A simple UI design for COVID Awareness website.
                                </p>
                                <div class="icons">
                                    <a class="lightbox preview" href="assets/videos/covid.mp4">
                                        <i class="icon-eye"></i>
                                    </a>
                                </div>
                            </div>
                        </div>               
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script>
        // Initialize WOW.js
        new WOW().init();
    </script>

</body>
</html>
